<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Planner — HSC 28 Academic to Admission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --surface:#f6f7f9;
  --surface-2:#eef0f3;
  --border:#e2e5ea;
  --text:#1a1d23;
  --text-soft:#65697a;
  --text-faint:#9297a6;
  --blue:#2563eb;
  --blue-soft:#eaf1fe;
  --green:#15803d;
  --green-soft:#e8f5ed;
  --orange:#c2560c;
  --orange-soft:#fdf1e7;
  --red:#c81e3a;
  --red-soft:#fdecef;
  --radius-s:6px;
  --radius-m:8px;
  --radius-l:12px;
  --nav-w:224px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans Bengali','Inter',sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
  font-size:14px;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em;}
button{font-family:inherit;}
a{color:var(--blue); text-decoration:none;}
::selection{background:var(--blue-soft);}

/* ===================== Layout shell ===================== */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:var(--nav-w); flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--border); padding:18px 12px;
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:9px; padding:6px 10px 20px;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:'Inter';flex-shrink:0;}
.brand-text b{display:block;font-size:13px;font-weight:700;line-height:1.25;}
.brand-text span{font-size:11px;color:var(--text-faint);}

.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-m);
  color:var(--text-soft); font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px;
  border:none; background:none; width:100%; text-align:left;
}
.nav-item svg{flex-shrink:0; opacity:.8;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--blue-soft); color:var(--blue);}
.nav-item.active svg{opacity:1;}

.main{margin-left:var(--nav-w); flex:1; min-width:0; padding-bottom:70px;}
.page{max-width:980px; margin:0 auto; padding:22px 22px 60px;}

.topbar-mobile{
  display:none; position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--border); padding:12px 16px; align-items:center; justify-content:space-between;
}
.topbar-mobile .brand{padding:0;}
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--bg); border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav-inner{display:flex; justify-content:space-between;}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
  border:none; background:none; color:var(--text-faint); font-size:10.5px; font-weight:600; cursor:pointer;
}
.bn-item.active{color:var(--blue);}

@media (max-width:840px){
  .sidebar{display:none;}
  .main{margin-left:0; padding-bottom:78px;}
  .topbar-mobile{display:flex;}
  .bottom-nav{display:block;}
  .page{padding:16px 14px 40px;}
}

/* ===================== Common building blocks ===================== */
.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h1{font-size:19px;}
.page-sub{color:var(--text-soft); font-size:12.5px; margin-top:3px;}

.card{background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px 18px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
@media (max-width:700px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 14px;}
.stat-card b{display:block; font-size:19px; font-family:'Inter'; font-weight:800;}
.stat-card span{font-size:11.5px; color:var(--text-soft); font-weight:600;}
.stat-card.accent-blue b{color:var(--blue);}
.stat-card.accent-green b{color:var(--green);}
.stat-card.accent-orange b{color:var(--orange);}

.progress-track{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.progress-track > i{display:block; height:100%; background:var(--green); border-radius:5px; transition:width .3s;}
.progress-track.blue > i{background:var(--blue);}
.progress-row{display:flex; align-items:center; gap:10px;}
.progress-row .progress-track{flex:1;}
.progress-row .pct{font-size:12px; font-weight:700; font-family:'Inter'; color:var(--text-soft); width:38px; text-align:right; flex-shrink:0;}

.btn{border-radius:var(--radius-m); padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid transparent; font-family:inherit;}
.btn-primary{background:var(--blue); color:#fff;}
.btn-primary:hover{background:#1d4fd1;}
.btn-outline{background:var(--bg); border-color:var(--border); color:var(--text);}
.btn-outline:hover{background:var(--surface);}
.btn-danger{background:var(--red); color:#fff;}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn-block{width:100%; text-align:center;}

.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--border); background:var(--bg); color:var(--text-soft); padding:6px 12px;
  border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;}
.chip.active{background:var(--blue); color:#fff; border-color:var(--blue);}

.badge{display:inline-block; font-size:10.5px; font-weight:700; border-radius:5px; padding:2px 7px; letter-spacing:.2px;}
.badge-blue{background:var(--blue-soft); color:var(--blue);}
.badge-green{background:var(--green-soft); color:var(--green);}
.badge-orange{background:var(--orange-soft); color:var(--orange);}
.badge-gray{background:var(--surface-2); color:var(--text-soft);}

input[type=text], input[type=search], input[type=number], textarea, select{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-s); padding:9px 11px;
  font-family:inherit; font-size:13.5px; background:var(--bg); color:var(--text);
}
textarea{resize:vertical; min-height:70px;}
label.field-label{font-size:12px; font-weight:700; color:var(--text-soft); display:block; margin:12px 0 5px;}
label.field-label:first-of-type{margin-top:0;}

.search-box{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:9px 12px;}
.search-box input{border:none; background:none; padding:0; outline:none;}
.search-box svg{flex-shrink:0; color:var(--text-faint);}

.state-box{text-align:center; padding:44px 18px; color:var(--text-soft);}
.state-box h3{color:var(--text); margin:12px 0 6px; font-size:15px;}
.state-box p{font-size:13px; margin:0; max-width:400px; margin:0 auto;}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--blue);
  animation:spin .8s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.error-box{background:var(--red-soft); border:1px solid var(--red); color:var(--red); border-radius:var(--radius-m);
  padding:15px 17px; margin:14px 0; font-size:13px;}
.error-box h4{margin:0 0 6px; font-size:13.5px;}
.error-box pre{background:rgba(0,0,0,0.04); border-radius:6px; padding:9px 11px; font-size:11px;
  overflow-x:auto; white-space:pre-wrap; color:var(--text); margin:6px 0 0;}
.notice-box{background:var(--orange-soft); border:1px solid var(--orange); color:var(--orange); border-radius:var(--radius-m);
  padding:11px 14px; font-size:12.5px; margin:10px 0;}
.seed-banner{background:var(--blue-soft); border:1px solid var(--blue); border-radius:var(--radius-m); padding:15px 17px; margin:14px 0; font-size:13px;}
.seed-banner b{display:block; margin-bottom:6px; color:var(--blue);}

/* ===================== Task rows / cards ===================== */
.task-card{border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:8px; background:var(--bg);}
.task-card.completed{background:var(--green-soft); border-color:#c7e6d3;}
.task-top{display:flex; gap:10px; align-items:flex-start;}
.task-check{
  width:22px;height:22px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--text-faint);
  background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.task-check.checked{background:var(--green); border-color:var(--green);}
.task-check svg{opacity:0;}
.task-check.checked svg{opacity:1;}
.task-main{flex:1; min-width:0;}
.task-title{font-size:13.5px; font-weight:600;}
.task-card.completed .task-title{color:var(--text-soft); text-decoration:line-through; text-decoration-color:#b9dcc4;}
.task-desc{font-size:12px; color:var(--text-soft); margin-top:5px; line-height:1.55; display:none;}
.task-desc.open{display:block;}
.task-meta-row{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
.task-progress-inline{display:flex;align-items:center;gap:6px;min-width:110px;flex:1;}
.task-progress-inline .progress-track{flex:1;height:6px;}
.task-progress-inline .pct{font-size:11px;color:var(--text-soft);font-family:'Inter';font-weight:700;width:32px;text-align:right;}
.pct-select{border:1px solid var(--border); border-radius:var(--radius-s); font-size:11.5px; padding:4px 6px; background:var(--bg); color:var(--text-soft); font-family:inherit;}
.icon-btn{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:5px;border-radius:5px;display:flex;flex-shrink:0;}
.icon-btn:hover{background:var(--surface); color:var(--text);}

.section-card{border:1px solid var(--border); border-radius:var(--radius-l); margin:12px 0; overflow:hidden; background:var(--bg);}
.section-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer;}
.section-head:hover{background:var(--surface);}
.section-chevron{transition:transform .2s; flex-shrink:0; color:var(--text-faint);}
.section-card.open .section-chevron{transform:rotate(90deg);}
.section-titles{flex:1; min-width:0;}
.section-titles .s-name{font-weight:700; font-size:13.5px;}
.section-titles .s-sub{font-size:11.5px; color:var(--text-soft); margin-top:2px;}
.section-progress-mini{width:60px; flex-shrink:0;}
.mini-pct{font-size:10.5px; color:var(--text-soft); text-align:right; margin-top:3px; font-family:'Inter';}
.section-body{display:none; border-top:1px solid var(--border); padding:12px 16px;}
.section-card.open .section-body{display:block;}
.revision-tag{display:inline-flex;align-items:center;gap:5px;background:var(--orange-soft);color:var(--orange);
  font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:5px;letter-spacing:.3px;}

/* ===================== Modal ===================== */
.modal-overlay{position:fixed; inset:0; background:rgba(20,22,28,0.45); display:none; align-items:center; justify-content:center; z-index:200; padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--bg); border-radius:var(--radius-l); padding:22px; max-width:460px; width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,0.18); max-height:88vh; overflow-y:auto;}
.modal-box h3{font-size:15.5px; margin-bottom:14px;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}

/* ===================== Misc ===================== */
.hr{border:none; border-top:1px solid var(--border); margin:16px 0;}
.flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.muted{color:var(--text-soft);}
.small{font-size:12px;}
.day-nav{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
.day-nav select{max-width:180px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:560px){ .grid-2{grid-template-columns:1fr;} }
.list-link{display:block; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-m); margin-bottom:8px; cursor:pointer; background:var(--bg);}
.list-link:hover{background:var(--surface);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
</style>

const TABLE = "routine_tasks";
const DAILY_TABLE = "daily_reports";
const WEEKLY_TABLE = "weekly_reports";
const SETTINGS_TABLE = "user_settings";
const TOTAL_DAYS = 391;

const WEEKDAY_BN = ['শনিবার','রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার'];
const WEEKDAY_EN = ['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];

let ALL_TASKS = [];         // live rows from Supabase
let DAILY_REPORTS = {};     // day_number -> report_text
let WEEKLY_REPORTS = {};    // week_number -> report_text
let SETTINGS_ROW = null;    // { id, current_day }
let SCHEMA = { hasOrderIndex:true, hasDayNumber:true, hasWeekNumber:true, hasPhase:true, hasSubject:true, hasTaskType:true, hasProgress:true };

const SEED_BY_TITLE = new Map(SEED_TASKS.map(t => [t.title, t]));

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function weekdayOf(day){ return (day - 1) % 7; }
function isRevisionDay(day){ return weekdayOf(day) === 6; }

/* ---------------- Boot sequence ---------------- */

async function boot(){
  renderNav();
  try{
    const { count, error } = await sb.from(TABLE).select("*", { count:"exact", head:true });
    if (error) return showConnectionError(error);

    if (!count || count === 0){
      await runSeedFlow();
    } else {
      await loadAllTasks();
      await maybeBackfill();
      await loadReportsAndSettings();
      startRouter();
    }
  } catch(e){
    showConnectionError(e);
  }
}

function showConnectionError(error){
  const msg = (error && error.message) ? error.message : String(error);
  const code = (error && error.code) ? error.code : "";
  let rlsHint = "";
  if (/permission|policy|rls|row-level/i.test(msg) || code === "42501"){
    rlsHint = `
      <p style="margin-top:8px;">এটি সম্ভবত <b>Row Level Security (RLS)</b> এর কারণে হচ্ছে। <code>setup_v2.sql</code> ফাইলটি Supabase SQL Editor-এ চালান — এতে routine_tasks, daily_reports, weekly_reports, user_settings — সব টেবিলের জন্য প্রয়োজনীয় policy আছে।</p>`;
  }
  el("pageRoot").innerHTML = `
    <div class="error-box">
      <h4>⚠ Supabase সংযোগে সমস্যা হয়েছে</h4>
      <p>${esc(msg)}${code ? " (code: " + esc(code) + ")" : ""}</p>
      ${rlsHint}
      <p style="margin-top:8px;">সমাধান করার পর পেজ রিফ্রেশ করুন।</p>
    </div>`;
}

/* ---------------- Fresh seed (empty table) ---------------- */

async function runSeedFlow(){
  el("pageRoot").innerHTML = `
    <div class="seed-banner" id="seedBanner">
      <b>প্রথমবার সেটআপ — রুটিন ডেটা Supabase-এ ইমপোর্ট করা হচ্ছে...</b>
      <div id="seedStatus">০ / ${SEED_TASKS.length}</div>
      <div class="progress-track" style="margin-top:8px;"><i id="seedProgressBar" style="width:0%"></i></div>
    </div>`;

  const OPTIONAL = ["order_index","day_number","week_number","phase","subject","task_type","progress_percent"];
  let dropped = new Set();
  const BATCH = 50;
  let inserted = 0;

  for (let i = 0; i < SEED_TASKS.length; i += BATCH){
    let chunk = SEED_TASKS.slice(i, i + BATCH).map(t => {
      const row = { title:t.title, section:t.section, description:t.description, completed:false };
      OPTIONAL.forEach(c => { if (!dropped.has(c)) row[c] = t[c]; });
      return row;
    });

    let error, attempts = 0;
    while (attempts <= OPTIONAL.length){
      const r = await sb.from(TABLE).insert(chunk);
      error = r.error;
      if (!error) break;
      const m = /column [`"']?([a-zA-Z_]+)[`"']?/i.exec(error.message || "");
      if (m && OPTIONAL.includes(m[1]) && !dropped.has(m[1])){
        dropped.add(m[1]);
        chunk.forEach(row => delete row[m[1]]);
        attempts++;
        continue;
      }
      break;
    }

    if (error){
      el("pageRoot").innerHTML = `
        <div class="error-box">
          <h4>⚠ ডেটা ইমপোর্ট করতে সমস্যা হয়েছে</h4>
          <p>${esc(error.message)}</p>
          <p style="margin-top:6px;">${inserted} / ${SEED_TASKS.length} টাস্ক ইমপোর্ট হয়েছিল। সমাধান করে রিফ্রেশ করুন, বা seed.js কমান্ড লাইন স্ক্রিপ্ট দিয়ে চালিয়ে যান।</p>
        </div>`;
      return;
    }
    inserted += chunk.length;
    el("seedStatus").textContent = `${inserted} / ${SEED_TASKS.length}`;
    el("seedProgressBar").style.width = Math.round(inserted/SEED_TASKS.length*100) + "%";
  }

  await loadAllTasks();
  await loadReportsAndSettings();
  startRouter();
}

/* ---------------- Backfill (existing v1 rows missing v2 columns) ---------------- */

async function maybeBackfill(){
  if (ALL_TASKS.length === 0) return;
  const sample = ALL_TASKS[0];
  SCHEMA.hasDayNumber = Object.prototype.hasOwnProperty.call(sample, "day_number");
  SCHEMA.hasWeekNumber = Object.prototype.hasOwnProperty.call(sample, "week_number");
  SCHEMA.hasPhase = Object.prototype.hasOwnProperty.call(sample, "phase");
  SCHEMA.hasSubject = Object.prototype.hasOwnProperty.call(sample, "subject");
  SCHEMA.hasTaskType = Object.prototype.hasOwnProperty.call(sample, "task_type");
  SCHEMA.hasProgress = Object.prototype.hasOwnProperty.call(sample, "progress_percent");
  SCHEMA.hasOrderIndex = Object.prototype.hasOwnProperty.call(sample, "order_index");

  if (!SCHEMA.hasDayNumber){
    // Columns don't exist at all yet — app can still run in a reduced mode,
    // but we tell the user clearly instead of silently degrading.
    el("pageRoot").innerHTML = `
      <div class="error-box">
        <h4>⚠ নতুন কলাম পাওয়া যায়নি</h4>
        <p>এই আপগ্রেডের জন্য <code>day_number</code>, <code>week_number</code>, <code>phase</code>, <code>subject</code>, <code>task_type</code>, <code>progress_percent</code> কলাম প্রয়োজন। অনুগ্রহ করে Supabase SQL Editor-এ <code>setup_v2.sql</code> চালান, তারপর পেজ রিফ্রেশ করুন। আপনার আগের ডেটা/progress অক্ষত আছে — কোনো row ডিলিট হয়নি।</p>
      </div>`;
    throw new Error("halt"); // stop boot(); message already shown
  }

  const needsBackfill = ALL_TASKS.filter(t => t.day_number === null || t.day_number === undefined);
  if (needsBackfill.length === 0) return;

  el("pageRoot").innerHTML = `
    <div class="seed-banner" id="seedBanner">
      <b>বিদ্যমান ডেটা আপগ্রেড করা হচ্ছে (progress অক্ষত থাকবে)...</b>
      <div id="seedStatus">০ / ${needsBackfill.length}</div>
      <div class="progress-track" style="margin-top:8px;"><i id="seedProgressBar" style="width:0%"></i></div>
    </div>`;

  let done = 0;
  for (const row of needsBackfill){
    const ref = SEED_BY_TITLE.get(row.title);
    if (!ref) { done++; continue; } // custom task the user added — leave alone
    const patch = {
      day_number: ref.day_number, week_number: ref.week_number, phase: ref.phase,
      subject: ref.subject, task_type: ref.task_type,
    };
    if (SCHEMA.hasOrderIndex && (row.order_index === null || row.order_index === undefined)) patch.order_index = ref.order_index;
    if (SCHEMA.hasProgress && (row.progress_percent === null || row.progress_percent === undefined)) patch.progress_percent = row.completed ? 100 : 0;
    const { error } = await sb.from(TABLE).update(patch).eq("id", row.id);
    if (!error){
      Object.assign(row, patch);
    }
    done++;
    el("seedStatus").textContent = `${done} / ${needsBackfill.length}`;
    el("seedProgressBar").style.width = Math.round(done/needsBackfill.length*100) + "%";
  }
}

/* ---------------- Load ---------------- */

async function loadAllTasks(){
  let rows = [];
  const PAGE = 1000;
  let from = 0;
  while (true){
    const { data, error } = await sb.from(TABLE).select("*").range(from, from + PAGE - 1);
    if (error) throw error;
    rows = rows.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  rows.sort((a,b) => {
    const ao = a.order_index ?? SEED_BY_TITLE.get(a.title)?.order_index ?? 999999;
    const bo = b.order_index ?? SEED_BY_TITLE.get(b.title)?.order_index ?? 999999;
    return ao - bo;
  });
  ALL_TASKS = rows;
}

async function loadReportsAndSettings(){
  try{
    const { data: dr } = await sb.from(DAILY_TABLE).select("*");
    DAILY_REPORTS = {}; (dr||[]).forEach(r => DAILY_REPORTS[r.day_number] = r.report_text || "");
  } catch(e){ /* table may not exist yet — non-fatal */ }
  try{
    const { data: wr } = await sb.from(WEEKLY_TABLE).select("*");
    WEEKLY_REPORTS = {}; (wr||[]).forEach(r => WEEKLY_REPORTS[r.week_number] = r.report_text || "");
  } catch(e){ /* non-fatal */ }
  try{
    const { data: us } = await sb.from(SETTINGS_TABLE).select("*").limit(1);
    if (us && us.length){ SETTINGS_ROW = us[0]; }
    else {
      const { data: created } = await sb.from(SETTINGS_TABLE).insert({ current_day: 1 }).select();
      SETTINGS_ROW = created && created[0] ? created[0] : { current_day: 1 };
    }
  } catch(e){ SETTINGS_ROW = { current_day: 1 }; }
}

function getCurrentDay(){ return (SETTINGS_ROW && SETTINGS_ROW.current_day) || 1; }

async function setCurrentDay(day){
  if (!SETTINGS_ROW) SETTINGS_ROW = {};
  SETTINGS_ROW.current_day = day;
  if (SETTINGS_ROW.id){
    await sb.from(SETTINGS_TABLE).update({ current_day: day }).eq("id", SETTINGS_ROW.id);
  } else {
    const { data } = await sb.from(SETTINGS_TABLE).insert({ current_day: day }).select();
    if (data && data[0]) SETTINGS_ROW = data[0];
  }
}

/* ---------------- Derived data helpers ---------------- */

function tasksForDay(day){ return ALL_TASKS.filter(t => t.day_number === day); }
function tasksForWeek(week, phase){ return ALL_TASKS.filter(t => t.week_number === week && (phase ? t.phase === phase : true)); }
function tasksForPhase(phase){ return ALL_TASKS.filter(t => t.phase === phase); }
function tasksForSubject(subject){ return ALL_TASKS.filter(t => t.subject === subject); }

function phasesInOrder(){
  const seen = [];
  ALL_TASKS.forEach(t => { if (t.phase && !seen.includes(t.phase)) seen.push(t.phase); });
  return seen;
}
function weeksInPhase(phase){
  const seen = [];
  ALL_TASKS.filter(t=>t.phase===phase).forEach(t => { if (!seen.includes(t.week_number)) seen.push(t.week_number); });
  return seen;
}
function daysInWeek(week, phase){
  const seen = [];
  ALL_TASKS.filter(t=>t.week_number===week && t.phase===phase).forEach(t => { if (!seen.includes(t.day_number)) seen.push(t.day_number); });
  return seen.sort((a,b)=>a-b);
}
function subjectsList(){
  const seen = [];
  ALL_TASKS.forEach(t => { if (t.subject && !seen.includes(t.subject)) seen.push(t.subject); });
  return seen.sort();
}
function phaseOfDay(day){
  const t = ALL_TASKS.find(t => t.day_number === day);
  return t ? t.phase : null;
}
function weekOfDay(day){
  const t = ALL_TASKS.find(t => t.day_number === day);
  return t ? t.week_number : null;
}

function stats(tasks){
  const total = tasks.length;
  const done = tasks.filter(t => t.completed).length;
  const inProgress = tasks.filter(t => !t.completed && (t.progress_percent||0) > 0).length;
  return { total, done, remaining: total-done, inProgress, pct: total ? Math.round(done/total*100) : 0 };
}
function isDayComplete(day){
  const tasks = tasksForDay(day);
  return tasks.length > 0 && tasks.every(t => t.completed);
}
function completedDaysCount(){
  let c = 0;
  for (let d=1; d<=TOTAL_DAYS; d++) if (isDayComplete(d)) c++;
  return c;
}

/* ---------------- Router ---------------- */

const ROUTES = {};
function registerRoute(pattern, handler){ ROUTES[pattern] = handler; }

function startRouter(){
  window.addEventListener("hashchange", renderRoute);
  if (!location.hash) location.hash = "#/dashboard";
  renderRoute();
}

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, "");
  return hash.split("/").filter(Boolean);
}

function navTo(path){ location.hash = "#/" + path; }

function renderRoute(){
  const parts = currentRoute();
  const top = parts[0] || "dashboard";
  renderNav(top);
  try{
    if (top === "dashboard") renderDashboard();
    else if (top === "routine") renderMyRoutine();
    else if (top === "day") renderDayView(parseInt(parts[1]) || getCurrentDay());
    else if (top === "phases") parts[1] ? renderPhaseDetail(decodeURIComponent(parts[1])) : renderPhases();
    else if (top === "subjects") parts[1] ? renderSubjectDetail(decodeURIComponent(parts[1])) : renderSubjects();
    else if (top === "reports") renderReports(parts[1], parts[2]);
    else if (top === "editor") renderEditor(parts[1]);
    else renderDashboard();
  } catch(e){
    console.error(e);
    el("pageRoot").innerHTML = `<div class="error-box"><h4>একটি সমস্যা হয়েছে</h4><p>${esc(e.message||String(e))}</p></div>`;
  }
  window.scrollTo(0,0);
}

/* ---- Task mutation ---- */

async function toggleTaskDone(id){
  const task = ALL_TASKS.find(t => String(t.id) === String(id));
  if (!task) return;
  const newDone = !task.completed;
  const newPct = newDone ? 100 : 0;
  const patch = { completed: newDone };
  if (SCHEMA.hasProgress) patch.progress_percent = newPct;
  const { error } = await sb.from(TABLE).update(patch).eq("id", id);
  if (error){ alert("সেভ করতে সমস্যা: " + error.message); return; }
  task.completed = newDone;
  task.progress_percent = newPct;
  await afterTaskChange(task);
  renderRoute();
}

async function setTaskProgress(id, pct){
  const task = ALL_TASKS.find(t => String(t.id) === String(id));
  if (!task) return;
  const completed = pct === 100;
  const patch = { progress_percent: pct, completed };
  const { error } = await sb.from(TABLE).update(patch).eq("id", id);
  if (error){ alert("সেভ করতে সমস্যা: " + error.message); return; }
  task.progress_percent = pct;
  task.completed = completed;
  await afterTaskChange(task);
  renderRoute();
}

async function afterTaskChange(task){
  // Auto-advance current day if the *current* day just hit 100%
  const day = task.day_number;
  if (!day) return;
  if (day === getCurrentDay() && isDayComplete(day) && day < TOTAL_DAYS){
    await setCurrentDay(day + 1);
  }
}

    </div>

function applyStatusFilter(tasks){
  if (routineFilters.status === 'completed') return tasks.filter(t=>t.completed);
  if (routineFilters.status === 'remaining') return tasks.filter(t=>!t.completed);
  return tasks;
}

function renderRoutineBody(){
  const q = routineFilters.q.trim().toLowerCase();

  if (q){
    let matches = ALL_TASKS.filter(t => t.title.toLowerCase().includes(q));
    matches = applyStatusFilter(matches);
    if (routineFilters.subject) matches = matches.filter(t => t.subject === routineFilters.subject);
    el("routineBody").innerHTML = matches.length
      ? matches.map(t => taskCardHtml(t, {showDay:true})).join("")
      : `<div class="state-box"><h3>কোনো ফল পাওয়া যায়নি</h3></div>`;
    wireTaskCardEvents();
    return;
  }

  const weeks = weeksInPhase(routineFilters.phase);
  let html = "";
  weeks.forEach(week => {
    const days = daysInWeek(week, routineFilters.phase);
    const weekTasks = tasksForWeek(week, routineFilters.phase);
    const ws = stats(weekTasks);
    html += `<div class="flex-between" style="margin:16px 0 8px;"><h3 style="font-size:13px;">Week ${week}</h3><span class="small muted">${ws.done}/${ws.total} · ${ws.pct}%</span></div>`;
    days.forEach(day => {
      let dayTasks = tasksForDay(day);
      if (routineFilters.subject) dayTasks = dayTasks.filter(t => t.subject === routineFilters.subject);
      dayTasks = applyStatusFilter(dayTasks);
      if (routineFilters.subject && dayTasks.length === 0) return;

          </div>
        </div>`;
    });
  });
  el("routineBody").innerHTML = html || `<div class="state-box"><h3>কোনো টাস্ক নেই</h3></div>`;
  document.querySelectorAll("[data-toggleday]").forEach(node => {

  const task_type = el("mType").value;
  const description = el("mDesc").value.trim();
  const progress_percent = parseInt(el("mProgress").value);
  const completed = progress_percent === 100;
  const section = `${phase||''} · Week ${week||'?'} (Day ${day||'?'})`;

  if (!title){ alert("টাইটেল আবশ্যক।"); return; }

  const payload = { title, section, description, completed, day_number:day, week_number:week, phase, subject, task_type, progress_percent };

  if (existing){
    const { error } = await sb.from(TABLE).update(payload).eq("id", existing.id);
    if (error){ alert("আপডেট করতে সমস্যা: " + error.message); return; }
    Object.assign(existing, payload);
  } else {
    const maxOrder = Math.max(0, ...ALL_TASKS.map(t => t.order_index ?? 0));
    payload.order_index = maxOrder + 1;
    const { data, error } = await sb.from(TABLE).insert(payload).select();
    if (error){ alert("যুক্ত করতে সমস্যা: " + error.message); return; }
    if (data && data[0]) ALL_TASKS.push(data[0]);
  }
  closeTaskModal();
  renderRoute();
}

async function deleteTaskModal(task){
  if (!confirm("This will permanently remove this task from your routine. Continue?")) return;
  const { error } = await sb.from(TABLE).delete().eq("id", task.id);
  if (error){ alert("ডিলিট করতে সমস্যা: " + error.message); return; }
  ALL_TASKS = ALL_TASKS.filter(t => String(t.id) !== String(task.id));
  closeTaskModal();
  renderRoute();
}

/* ---- CA26 gallery + Edit Report (implemented in ca26/ca26-core.js and ca26/ca26-ui.js) ---- */
function ca26Missing(backTo, label){
  el("pageRoot").innerHTML = `<div class="error-box"><h4>CA26 files not found</h4><p>Upload the <code>ca26/</code> folder (ca26.css, ca26-core.js, ca26-ui.js, original/) next to index.html, then reload.</p></div><button class="btn btn-outline btn-sm" onclick="navTo('${backTo}')">${label}</button>`;
}
function renderCa26Gallery(){
  if (!window.CA26UI || !window.CA26Core) return ca26Missing("reports", "← Reports");
  CA26UI.renderGallery({ container: el("pageRoot"), cfg: { url: SUPABASE_URL, key: SUPABASE_KEY }, onBack: () => navTo("reports") });
}
function renderCa26Editor(){
  if (!window.CA26UI || !window.CA26Core) return ca26Missing("editor", "← Editor");
  CA26UI.renderEditor({ container: el("pageRoot"), cfg: { url: SUPABASE_URL, key: SUPABASE_KEY }, onBack: () => navTo("editor") });
}

el("modalOverlay").addEventListener("click", (ev) => { if (ev.target.id === "modalOverlay") closeTaskModal(); });

boot();
</script>
